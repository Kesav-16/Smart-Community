{% extends "templates/web.html" %}
{% block title %}Bill Details{% endblock %}

{% block page_content %}

<!-- Navbar -->
<nav class="custom-navbar">
  <div class="nav-left">
    <a href="/guest-dashboard">Dashboard</a>
    <a href="/monthly-bill">Monthly Bill</a>
    <a href="/maintenance-ticket/new">Raise Ticket</a>
  </div>
  <div class="nav-right">
    <a href="#" id="logoutBtn">Logout</a>
  </div>
</nav>
<br>
<div class="container mt-5">
  <h4 class="mb-4 text-primary">📄 Bill Details</h4>
  <div id="billDetailsContainer"></div>
</div>

<style>
body { 
  font-family: 'Inter', sans-serif; 
  background: #f8fafc; 
  margin: 0;
  padding: 0;
}

/* ✅ Responsive Navbar */
.custom-navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;              /* Full viewport width */
  background: #2563eb;
  color: white;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 12px 30px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  z-index: 1000;
}

.custom-navbar a {
  color: white;
  text-decoration: none;
  margin: 0 20px;
  font-weight: 600;
  transition: color 0.3s;
}

.custom-navbar a:hover {
  color: #ffeb3b;
}

.nav-left, .nav-right {
  display: flex;
  align-items: center;
}

/* ✅ Mobile Navigation (Hamburger Menu) */
.menu-toggle {
  display: none;
  flex-direction: column;
  cursor: pointer;
}

.menu-toggle span {
  height: 3px;
  width: 25px;
  background: white;
  margin: 4px 0;
  border-radius: 3px;
}

/* ✅ Responsive Layout */
@media (max-width: 768px) {
  .custom-navbar {
    flex-direction: column;
    align-items: flex-start;
    padding: 10px 20px;
  }

  .menu-toggle {
    display: flex;
    position: absolute;
    right: 20px;
    top: 18px;
  }

  .nav-left, .nav-right {
    flex-direction: column;
    width: 100%;
    display: none;
    background: #1e40af;
    border-radius: 8px;
    margin-top: 10px;
  }

  .nav-left.show, .nav-right.show {
    display: flex;
  }

  .custom-navbar a {
    width: 100%;
    text-align: left;
    padding: 10px 15px;
    margin: 0;
    border-top: 1px solid rgba(255,255,255,0.2);
  }
}

.bill-card {
  background: #fff; 
  padding: 20px; 
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
  margin-bottom: 15px;
  transition: transform 0.3s;
}
.bill-card:hover { transform: translateY(-3px); }

.toggle-section {
  background: #e0f2fe;
  border-radius: 8px;
  padding: 10px 15px;
  margin-bottom: 12px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
}
.toggle-section:hover { background: #2563eb; color: white; }

.bill-items { padding-left: 20px; }
</style>

<script>
frappe.ready(function() {
  const email = sessionStorage.getItem("guest_email");
  if (!email) { window.location.href = "/guest-login"; return; }

  const container = document.getElementById("billDetailsContainer");

  frappe.call({
    method: "smart_community.smart_community.api.get_guest_bills",
    args: { email: email },
    callback: function(r) {
      const bills = r.message.bills || [];
      if (bills.length === 0) {
        container.innerHTML = `<p class="text-muted">No bills available.</p>`;
        return;
      }

      // Group bills by month-year
      const grouped = {};
      bills.forEach(b => {
        const label = `${b.billing_month} ${b.billing_year}`;
        if (!grouped[label]) grouped[label] = [];
        grouped[label].push(b);
      });

      let html = "";
      Object.keys(grouped).forEach(monthLabel => {
        html += `
          <div class="toggle-section" data-target="${monthLabel.replace(/\s+/g, '_')}">
            <span>📅 ${monthLabel}</span>
            <span>&#9660;</span>
          </div>
          <div id="${monthLabel.replace(/\s+/g, '_')}" style="display:none;">
            ${grouped[monthLabel].map(bill => {
              let items = "";
              if (bill.items && bill.items.length) {
                items = "<ul class='bill-items'>";
                bill.items.forEach(i => {
                  items += `<li>${i.consumption_log}: ₹${i.amount}</li>`;
                });
                items += "</ul>";
              }
              return `
                <div class="bill-card">
                  <p><strong>Resident:</strong> ${bill.resident}</p>
                  <p><strong>Billing Month:</strong> ${bill.billing_month} ${bill.billing_year}</p>
                  <p><strong>Due Date:</strong> ${bill.due_date}</p>
                  <p><strong>Status:</strong> <span style="color:${bill.status==="Paid"?"green":"red"}">${bill.status}</span></p>
                  <p><strong>Days Late:</strong> ${bill.days_late || 0}</p>
                  <p><strong>Late Fee:</strong> ₹${bill.late_fee_amount || 0}</p>
                  <p><strong>Consumption:</strong> ${items}</p>
                  <p><strong>Total:</strong> ₹${bill.total_with_late || bill.total_amount || 0}</p>
                </div>`;
            }).join('')}
          </div>
        `;
      });

      container.innerHTML = html;

      document.querySelectorAll(".toggle-section").forEach(section => {
        section.addEventListener("click", function() {
          const target = document.getElementById(this.dataset.target);
          const arrow = this.querySelector("span:last-child");
          if (target.style.display === "none") {
            target.style.display = "block";
            arrow.innerHTML = "&#9650;";
          } else {
            target.style.display = "none";
            arrow.innerHTML = "&#9660;";
          }
        });
      });
    }
  });

  const deskNav = document.querySelector(".navbar, #navbarSupportedContent");
  if (deskNav) deskNav.style.display = "none";

  // Logout
  document.getElementById("logoutBtn").addEventListener("click", e => {
    e.preventDefault();
    sessionStorage.removeItem("guest_email");
    frappe.msgprint("Logged out");
    window.location.href = "/guest-login";
  });

  // Hamburger menu toggle
  const menuToggle = document.querySelector(".menu-toggle");
  const navLeft = document.querySelector(".nav-left");
  const navRight = document.querySelector(".nav-right");

  if (menuToggle) {
    menuToggle.addEventListener("click", () => {
      navLeft.classList.toggle("show");
      navRight.classList.toggle("show");
    });
  }
});
</script>

{% endblock %}
