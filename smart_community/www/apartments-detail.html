{% extends "templates/web.html" %}

{% block title %}Apartments{% endblock %}

{% block page_content %}
<style>
body {
  background: #f6f8fb;
  font-family: 'Inter', sans-serif;
  margin: 0;
  padding: 0;
}

/* 🌐 Full Responsive Navbar */
.custom-navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;              /* Full viewport width */
  background: #2563eb;
  color: white;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 12px 30px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  z-index: 1000;
}

.custom-navbar a {
  color: white;
  text-decoration: none;
  margin: 0 20px;
  font-weight: 600;
  transition: color 0.3s;
}

.custom-navbar a:hover {
  color: #ffeb3b;
}

/*  Apartment Section */
.apartment-container {
  max-width: 1100px;
  margin: 40px auto 50px; /* Added top margin to offset fixed navbar */
  padding: 0 20px;
}

.apartment-title {
  text-align: center;
  font-size: 2.5rem;
  font-weight: 700;
  margin-bottom: 40px;
  color: #2c3e50;
}

.apartment-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 25px;
}

.apartment-card {
  background: #fff;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.apartment-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

.apartment-card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.apartment-info {
  padding: 20px;
}

.apartment-info h3 {
  font-size: 1.5rem;
  color: #34495e;
  margin-bottom: 10px;
}

.apartment-info p {
  color: #7f8c8d;
  margin-bottom: 15px;
}

.apartment-info .rent {
  font-weight: bold;
  color: #27ae60;
  margin-bottom: 15px;
}

.register-btn {
  display: inline-block;
  background: #3498db;
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  text-decoration: none;
  transition: background 0.3s;
}

.register-btn:hover {
  background: #2980b9;
}

/* 📱 Responsive Navbar */
.nav-toggle {
  display: none;
  font-size: 1.8rem;
  cursor: pointer;
  color: white;
}

@media (max-width: 1024px) {
  .custom-navbar {
    padding: 12px 20px;
  }
}

@media (max-width: 768px) {
  .custom-navbar {
    justify-content: space-between;
  }

  .nav-toggle {
    display: block;
  }

  .nav-links {
    display: none;
    position: absolute;
    top: 60px;
    right: 0;
    background: #1e40af;
    width: 60%;
    text-align: center;
    flex-direction: column;
    border-top: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .nav-links a {
    display: block;
    margin: 15px 0;
    padding: 10px 0;
  }

  .nav-links.active {
    display: flex;
  }
}

@media (max-width: 480px) {
  .custom-navbar {
    flex-direction: row;
    padding: 10px 15px;
  }

  .nav-links {
    width: 100%;
  }

  .nav-links a {
    margin: 10px 0;
  }

  .apartment-title {
    font-size: 2rem;
  }
}
</style>

<!-- 🌐 Custom Navbar -->
<nav class="custom-navbar">
  <div class="nav-toggle" onclick="toggleMenu()">☰</div>
  <div class="nav-links">
    <a href="http://smart.localhost:8001/apartments-detail">Dashboard</a>
    <a href="http://smart.localhost:8001/about">About</a>
    <a href="http://smart.localhost:8001/login-apartment">Login</a>
  </div>
</nav>

<!-- 🏢 Apartment Section -->
<div class="apartment-container">
  <h1 class="apartment-title">Available Apartments</h1>
  <div class="apartment-grid" id="apartmentGrid"></div>
</div>

<script>
function toggleMenu() {
  document.querySelector('.nav-links').classList.toggle('active');
}

frappe.ready(function () {
  const apartments = [
    {
      name: "Ocean View Apartment",
      image: "https://www.shutterstock.com/image-photo/new-modern-block-flats-green-600nw-2437363335.jpg",
      rent: "₹35,000/month",
      location: "Chennai, Tamil Nadu",
      description: "Modern sea-facing apartment with 2 bedrooms and balcony.",
      url: "http://smart.localhost:8001/ocean-view-apartment"
    },
    {
      name: "Skyline Residency",
      image: "https://cdn.apartmentlist.com/image/fetch/c_fit,dpr_auto,f_auto,h_640,q_auto,w_640/https://images.ctfassets.net/jeox55pd4d8n/19QxcPxLaCYBiWoHdgRUvk/928d84b86e24192577ecb17790c1a903/apartment-complex-vs-buildng1.webp",
      rent: "₹42,000/month",
      location: "Bangalore, Karnataka",
      description: "Luxurious 3BHK apartment in city center.",
      url: "skyline-residency"
    },
    {
      name: "Garden View Flats",
      image: "https://www.casagrand.co.in/wp-content/uploads/2023/05/Elevation-View-1-scaled.jpg?ver=1.211",
      rent: "₹48,000/month",
      location: "Coimbatore, Tamil Nadu",
      description: "Peaceful environment with lush green gardens.",
      url: "garden-view-flats"
    }
  ];

  const grid = document.getElementById("apartmentGrid");
  apartments.forEach(a => {
    const card = document.createElement("div");
    card.classList.add("apartment-card");
    card.innerHTML = `
      <img src="${a.image}" alt="${a.name}">
      <div class="apartment-info">
          <h3>${a.name}</h3>
          <p>${a.location}</p>
          <p class="rent">${a.rent}</p>
          <p>${a.description}</p>
          <a href="${a.url}" class="register-btn">More Details</a>
      </div>`;
    grid.appendChild(card);
  });

  // Hide default Frappe web navbar
  const deskNav = document.querySelector(".navbar, #navbarSupportedContent");
  if (deskNav) deskNav.style.display = "none";
});
</script>
{% endblock %}
