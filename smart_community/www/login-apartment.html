{% extends "templates/web.html" %}

{% block title %}Login{% endblock %}

{% block page_content %}
<style>
body { background:#f0f4f8; font-family:'Inter',sans-serif; }
.login-container {
    max-width:400px; margin:100px auto; background:#fff; border-radius:20px; padding:40px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}
.login-container h2 { text-align:center; margin-bottom:30px; color:#1e3a8a; font-weight:700; }
.login-container input {
    width:100%; padding:12px 15px; margin-bottom:15px; border-radius:10px; border:1px solid #cbd5e1;
}
.login-container button {
    width:100%; padding:12px; border-radius:10px; border:none; background:#2563eb; color:#fff; font-weight:600; cursor:pointer;
}
.login-container button:hover { background:#1e40af; }

.custom-navbar {
  width: 100%;
  background: #2563eb;
  color: white;
  display: flex;
  justify-content: right;
  align-items: center;
  padding: 12px 0;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  position: sticky;
  top: 0;
  z-index: 1000;
}
.custom-navbar a {
  color: white;
  text-decoration: none;
  margin: 0 20px;
  font-weight: 600;
  transition: color 0.3s;
}
.custom-navbar a:hover {
  color: #ffeb3b;
}

</style>

<div class="custom-navbar">
    <a href="http://smart.localhost:8001/apartments">Dashboard</a>
    <a href="http://smart.localhost:8001/about">About</a>
    <a href="http://smart.localhost:8001/login-apartment">Login</a>
</div>

<div class="login-container">
    <h2>User Login</h2>
    <input type="email" id="email" placeholder="Your Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
</div>

<script>
frappe.ready(function(){
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");

    loginBtn.addEventListener("click", function(){
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if(!email || !password){
            frappe.msgprint("Please enter email and password.");
            return;
        }

        frappe.call({
            method: "smart_community.smart_community.api.login_apartment_user",
            args: { email: email, password: password },
            callback: function(r){
                if(r && r.message){
                    if(r.message.status === "success"){
                        frappe.msgprint(r.message.message);
                        setTimeout(() => { window.location.href = "/booking/new?apartment_name={{ apartment_name | urlencode }}"; }, 1500);
                    } else {
                        frappe.msgprint(r.message.message);
                    }
                } else {
                    frappe.msgprint("Server error. Try again.");
                }
            }
        });
    });
     const deskNav = document.querySelector(".navbar, #navbarSupportedContent");
    if(deskNav) deskNav.style.display = "none";
});
</script>
{% endblock %}
