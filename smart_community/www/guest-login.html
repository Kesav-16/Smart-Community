{% extends "templates/web.html" %}

{% block title %}Resident Login{% endblock %}

{% block page_content %}
<div class="container my-5" style="max-width: 400px;">
    <h2 class="mb-4 text-center">Resident Login</h2>
    <div id="loginMsg"></div>
    <div class="card p-4 shadow-sm">
        <div class="mb-3">
            <label>Email</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="mb-3">
            <label>Password</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
        </div>
        <button id="loginBtn" class="btn btn-primary w-100">Login</button>
    </div>
</div>

<script>
frappe.ready(function() {
    const loginBtn = document.getElementById("loginBtn");
    const loginMsg = document.getElementById("loginMsg");

    loginBtn.addEventListener("click", function() {
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value.trim();

        if (!email || !password) {
            loginMsg.innerHTML = "<p class='text-danger'>Please enter both email and password.</p>";
            return;
        }

        loginMsg.innerHTML = "<p class='text-info'>Logging you in... Please wait</p>";

        frappe.call({
            method: "smart_community.smart_community.api.custom_login",
            args: { email: email, password: password },
            callback: function(r) {
                if (r.message.status === "success") {
                    // ✅ Set sessionStorage for guest dashboard
                    sessionStorage.setItem("guest_email", r.message.email);

                    loginMsg.innerHTML = "<p class='text-success'>Login successful! Redirecting...</p>";

                    // ✅ Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = "/guest-dashboard";
                    }, 800);
                } else {
                    loginMsg.innerHTML = `<p class='text-danger'>${r.message.error}</p>`;
                }
            },
            error: function() {
                loginMsg.innerHTML = "<p class='text-danger'>Server error. Try again later.</p>";
            }
        });
    });
});
</script>
{% endblock %}
