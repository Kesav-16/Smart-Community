{% extends "templates/web.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block page_content %}
<style>
.table-container {
    max-width: 1200px;
    margin: 50px auto;
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}
.table-container table {
    width: 100%;
    border-collapse: collapse;
}
.table-container th, td {
    padding: 12px 15px;
    text-align: left;
    border-bottom: 1px solid #ddd;
}
.table-container th {
    background-color: #2563eb;
    color: white;
}
.approve-btn, .reject-btn {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    font-weight: 600;
}
.approve-btn { background-color: #27ae60; }
.reject-btn { background-color: #e74c3c; }
</style>

<div class="table-container">
    <h2>Apartment Booking Requests</h2>
    <table id="bookingTable">
        <thead>
            <tr>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Apartment</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <!-- JS will populate here -->
        </tbody>
    </table>
</div>

<script>
frappe.ready(function() {
    function fetchBookings() {
        frappe.call({
            method: "frappe.client.get_list",
            args: {
                doctype: "Resident",
                fields: ["name", "full_name", "email", "phone", "apartment", "start_date", "end_date", "status"],
                filters: { status: ["in", ["Pending", "Approved"]] },
                limit_page_length: 50
            },
            callback: function(r) {
                const tbody = document.querySelector("#bookingTable tbody");
                tbody.innerHTML = "";
                r.message.forEach(record => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${record.full_name}</td>
                        <td>${record.email}</td>
                        <td>${record.phone}</td>
                        <td>${record.apartment}</td>
                        <td>${record.start_date}</td>
                        <td>${record.end_date}</td>
                        <td>${record.status}</td>
                        <td>
                            ${record.status === "Pending" ? `
                            <button class="approve-btn" data-name="${record.name}">Approve</button>
                            <button class="reject-btn" data-name="${record.name}">Reject</button>
                            ` : "No Action"}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                // Approve button click
                document.querySelectorAll(".approve-btn").forEach(btn => {
                    btn.addEventListener("click", function() {
                        const name = this.dataset.name;
                        frappe.call({
                            method: "frappe.client.set_value",
                            args: {
                                doctype: "Resident",
                                name: name,
                                fieldname: { status: "Approved" }
                            },
                            callback: function() { fetchBookings(); }
                        });
                    });
                });

                // Reject button click
                document.querySelectorAll(".reject-btn").forEach(btn => {
                    btn.addEventListener("click", function() {
                        const name = this.dataset.name;
                        frappe.call({
                            method: "frappe.client.set_value",
                            args: {
                                doctype: "Resident",
                                name: name,
                                fieldname: { status: "Rejected" }
                            },
                            callback: function() { fetchBookings(); }
                        });
                    });
                });
            }
        });
    }

    fetchBookings();
});
</script>
{% endblock %}
