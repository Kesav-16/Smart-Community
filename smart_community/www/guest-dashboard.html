{% extends "templates/web.html" %}

{% block title %}Guest Dashboard{% endblock %}

{% block page_content %}

<!-- Navbar -->
<div class="custom-navbar">
  <div class="nav-left">
    <a href="#" id="guestDashboardLink">Dashboard</a>
    <a href="/monthly-bill" id="monthlyBillBtn">Monthly Bill</a>
    <a href="/maintenance-ticket/new">Raise Ticket</a>
  </div>
  <div class="nav-right">
    <a href="#" id="logoutBtn">Logout</a>
  </div>
  <div class="nav-toggle">&#9776;</div>
</div>
<br><br>
<div class="container mt-4">

  <!-- Statistics Row -->
  <div class="row mb-4 align-items-stretch">
    <!-- Left Stats Cards -->
    <div class="col-md-4 d-flex flex-column gap-3">
      <div class="stats-card">
        <h6 class="text-secondary mb-2">Utilities Provided</h6>
        <div class="utilities-list mt-2" id="utilitiesList"></div>
      </div>

      <div class="stats-card">
        <h6 class="text-secondary mb-2">Additional Services</h6>
        <div class="utilities-list mt-2" id="servicesList"></div>
      </div>
    </div>

    <!-- Latest Bookings -->
    <div class="col-md-8">
      <div class="stats-card">
        <h6 class="text-secondary mb-3">Latest Bookings</h6>
        <div id="latestBookingsContainer"></div>
      </div>
    </div>
  </div>

  <!-- Monthly Bills Section -->
  <div class="row">
    <div class="col-md-12">
      <div class="stats-card">
        <div class="d-flex justify-content-between align-items-center">
          <h6 class="text-secondary mb-3">Monthly Bills</h6>
          <span id="toggleBills" style="cursor:pointer; font-size: 18px;">&#9660;</span>
        </div>
        <div id="monthlyBillContainer" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<style>
body {
  font-family: 'Inter', sans-serif;
  background: #f8fafc;
  margin: 0;
  padding: 0;
}

/* ✅ Responsive Navbar */
.custom-navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;              /* Full viewport width */
  background: #2563eb;
  color: white;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 12px 30px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  z-index: 1000;
}

.custom-navbar a {
  color: white;
  text-decoration: none;
  margin: 0 20px;
  font-weight: 600;
  transition: color 0.3s;
}

.custom-navbar a:hover {
  color: #ffeb3b;
}

/* ✅ Mobile Navbar Toggle */
.nav-toggle {
  display: none;
  font-size: 1.8rem;
  cursor: pointer;
}

/* ✅ Card Styling */
.stats-card {
  background: #fff;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.05);
  transition: transform 0.3s;
  margin-bottom: 20px;
}

.stats-card:hover { transform: translateY(-3px); }

.utilities-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 300px;
  overflow-y: auto;
}

.utility-item {
  background: #e0f2fe;
  padding: 8px 12px;
  border-radius: 8px;
  font-weight: 600;
  transition: all 0.3s;
}

.utility-item:hover {
  background: #2563eb;
  color: #fff;
}

#monthlyBillContainer {
  transition: all 0.3s ease-in-out;
  overflow: hidden;
}

.booking-item {
  background: #f0f9ff;
  padding: 12px 15px;
  border-radius: 10px;
  margin-bottom: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.05);
  position: relative;
}

.pay-now-btn {
  position: absolute;
  bottom: 10px;
  right: 10px;
  background: #1e40af;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}

.pay-now-btn:hover {
  background: #2563eb;
}

/* ✅ Tablet and Mobile Responsiveness */
@media (max-width: 1024px) {
  .custom-navbar {
    padding: 10px 15px;
  }
  .stats-card {
    padding: 18px;
  }
}

@media (max-width: 768px) {
  .custom-navbar {
    flex-direction: column;
    align-items: flex-start;
  }

  .custom-navbar .nav-left,
  .custom-navbar .nav-right {
    display: none;
    width: 100%;
    flex-direction: column;
    background: #1e40af;
    text-align: center;
    padding: 10px 0;
  }

  .custom-navbar.active .nav-left,
  .custom-navbar.active .nav-right {
    display: flex;
  }

  .custom-navbar a {
    display: block;
    margin: 10px 0;
  }

  .nav-toggle {
    display: block;
    color: white;
    align-self: flex-end;
  }

  .stats-card {
    padding: 15px;
  }
}

@media (max-width: 480px) {
  .custom-navbar a {
    font-size: 0.9rem;
  }

  .stats-card {
    padding: 12px;
  }

  .utility-item {
    font-size: 0.9rem;
  }

  .pay-now-btn {
    font-size: 0.85rem;
    padding: 5px 10px;
  }
}
</style>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
frappe.ready(function() {
  const utilitiesList = document.getElementById("utilitiesList");
  const servicesList = document.getElementById("servicesList");
  const latestBookingsContainer = document.getElementById("latestBookingsContainer");
  const monthlyBillContainer = document.getElementById("monthlyBillContainer");
  const toggleBills = document.getElementById("toggleBills");

  const email = sessionStorage.getItem("guest_email");
  if (!email) { window.location.href = "/guest-login"; return; }

  // Utilities and Services
  const utilities = ["Electricity: ₹8/unit", "Water: ₹10/liter", "Wi-Fi: ₹1,800/month", "Gym: ₹1,500/month"];
  const services = ["Housekeeping", "Laundry"];

  utilitiesList.innerHTML = utilities.map(u => `<div class="utility-item">${u}</div>`).join('');
  servicesList.innerHTML = services.map(s => `<div class="utility-item">${s}</div>`).join('');

  // Fetch Guest Bookings
  frappe.call({
    method: "smart_community.smart_community.api.get_guest_bookings",
    args: { email: email },
    callback: function(r) {
      const bookings = r.message.bookings || [];
      latestBookingsContainer.innerHTML = bookings.length
        ? bookings.map(b => `
          <div class="booking-item">
            <p><strong>Apartment:</strong> ${b.apartment}</p>
            <p><strong>Guest:</strong> ${b.full_name}</p>
            <p><strong>Booking:</strong> ${b.start_date} - ${b.end_date}</p>
            <p><strong>Status:</strong> ${b.status}</p>
          </div>
        `).join('')
        : `<p class="text-muted">No bookings found.</p>`;
    }
  });

  // Fetch Guest Bills
  frappe.call({
    method: "smart_community.smart_community.api.get_guest_bills",
    args: { email: email },
    callback: function(r) {
      let bills = r.message.bills || [];
      if (bills.length === 0) {
        monthlyBillContainer.innerHTML = `<p class="text-muted">No bills available.</p>`;
        return;
      }
      renderBills(bills);
    }
  });

  // Render Bills
  function renderBills(bills) {
    const unpaidBills = bills.filter(b => b.status === "Unpaid");

    if (unpaidBills.length === 0) {
      monthlyBillContainer.innerHTML = `<p class="text-success text-center fw-bold">🎉 All bills are paid.</p>`;
      return;
    }

    let billHtml = unpaidBills.map(bill => {
      let itemsHtml = "";
      if(bill.items?.length) {
        itemsHtml = '<ul>' + bill.items.map(item =>
          `<li>${item.consumption_log}: ₹${item.amount}</li>`
        ).join('') + '</ul>';
      }

      const totalAmount = bill.total_with_late || 0;

      return `
        <div class="booking-item">
          <p><strong>Resident:</strong> ${bill.resident}</p>
          <p><strong>Billing Month:</strong> ${bill.billing_month} ${bill.billing_year}</p>
          <p><strong>Due Date:</strong> ${bill.due_date}</p>
          <p><strong>Status:</strong> <span style="color:red">Unpaid</span></p>
          <p><strong>Total:</strong> ₹${totalAmount}</p>
          <button class="pay-now-btn" data-bill="${bill.name}" data-amount="${totalAmount}">Pay Now</button>
        </div>
      `;
    }).join('');

    monthlyBillContainer.innerHTML = billHtml;

    document.querySelectorAll(".pay-now-btn").forEach(btn => {
      btn.addEventListener("click", function() {
        const bill_name = this.dataset.bill;
        const amount = parseFloat(this.dataset.amount) * 100;

        var options = {
          "key": "rzp_test_1DP5mmOlF5G5ag",
          "amount": amount,
          "currency": "INR",
          "name": "Community Management",
          "description": "Bill Payment - " + bill_name,
          "handler": function(response){
            frappe.call({
              method: "smart_community.smart_community.api.mark_bill_paid",
              args: { bill_name: bill_name, payment_id: response.razorpay_payment_id },
              callback: function(res){
                frappe.msgprint("✅ Payment Successful!");
                const updatedBills = bills.filter(b => b.name !== bill_name);
                renderBills(updatedBills);
              }
            });
          },
          "theme": { "color": "#1e40af" }
        };
        new Razorpay(options).open();
      });
    });
  }

  // Toggle Bills
  toggleBills.addEventListener("click", function() {
    const open = monthlyBillContainer.style.display === "block";
    monthlyBillContainer.style.display = open ? "none" : "block";
    toggleBills.innerHTML = open ? "&#9660;" : "&#9650;";
  });

  // Navbar toggle (for mobile)
  const navBar = document.querySelector(".custom-navbar");
  const navToggle = document.querySelector(".nav-toggle");
  navToggle.addEventListener("click", () => navBar.classList.toggle("active"));

  // Hide default desk navbar
  const deskNav = document.querySelector(".navbar, #navbarSupportedContent");
  if (deskNav) deskNav.style.display = "none";

  // Logout
  document.getElementById("logoutBtn").addEventListener("click", e => {
    e.preventDefault();
    sessionStorage.removeItem("guest_email");
    frappe.msgprint("Logged out");
    window.location.href="/guest-login";
  });
});
</script>

{% endblock %}
