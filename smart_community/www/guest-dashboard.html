{% extends "templates/web.html" %}

{% block title %}Guest Dashboard{% endblock %}

{% block page_content %}

<!-- Navbar -->
<div class="custom-navbar">
  <div class="nav-left">
    <a href="#" id="guestDashboardLink">Dashboard</a>
    <a href="/about">About</a>
    <a href="/monthly-bill" id="monthlyBillBtn">Monthly Bill</a>
    <a href="/maintenance-ticket/new">Raise Ticket</a>
  </div>
  <div class="nav-right">
    <a href="#" id="logoutBtn">Logout</a>
  </div>
</div>

<div class="container mt-4">

  <!-- Statistics Row -->
  <div class="row mb-4 align-items-stretch">
    <!-- Left Stats Cards -->
    <div class="col-md-4 d-flex flex-column gap-3">
      <div class="stats-card">
        <h6 class="text-secondary mb-2">Utilities Provided</h6>
        <div class="utilities-list mt-2" id="utilitiesList"></div>
      </div>

      <div class="stats-card">
        <h6 class="text-secondary mb-2">Additional Services</h6>
        <div class="utilities-list mt-2" id="servicesList"></div>
      </div>
    </div>

    <!-- Latest Bookings -->
    <div class="col-md-8">
      <div class="stats-card">
        <h6 class="text-secondary mb-3">Latest Bookings</h6>
        <div id="latestBookingsContainer"></div>
      </div>
    </div>
  </div>

  <!-- Monthly Bills Section -->
  <div class="row">
    <div class="col-md-12">
      <div class="stats-card">
        <div class="d-flex justify-content-between align-items-center">
          <h6 class="text-secondary mb-3">Monthly Bills</h6>
          <span id="toggleBills" style="cursor:pointer; font-size: 18px;">&#9660;</span>
        </div>
        <div id="monthlyBillContainer" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<style>
body { font-family: 'Inter', sans-serif; background: #f8fafc; }
.custom-navbar { width: 100%; background: #1e40af; color: white; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; }
.custom-navbar a { color: white; text-decoration: none; font-weight: 600; margin: 0 15px; transition: color 0.3s; }
.custom-navbar a:hover { color: #ffeb3b; }

.stats-card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 6px 20px rgba(0,0,0,0.05); transition: transform 0.3s; margin-bottom: 20px; }
.stats-card:hover { transform: translateY(-3px); }

.utilities-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
.utility-item { background: #e0f2fe; padding: 8px 12px; border-radius: 8px; font-weight: 600; transition: all 0.3s; }
.utility-item:hover { background: #2563eb; color: #fff; }

#monthlyBillContainer { transition: all 0.3s ease-in-out; overflow: hidden; }
.booking-item { background: #f0f9ff; padding: 12px 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.05); position: relative; }
.pay-now-btn { position: absolute; bottom: 10px; right: 10px; background: #1e40af; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
.pay-now-btn:hover { background: #2563eb; }
</style>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
frappe.ready(function() {

  const utilitiesList = document.getElementById("utilitiesList");
  const servicesList = document.getElementById("servicesList");
  const latestBookingsContainer = document.getElementById("latestBookingsContainer");
  const monthlyBillContainer = document.getElementById("monthlyBillContainer");
  const toggleBills = document.getElementById("toggleBills");

  const email = sessionStorage.getItem("guest_email");
  if (!email) { window.location.href = "/guest-login"; return; }

  const utilities = ["Electricity: ₹8/unit", "Water: ₹10/liter", "Wi-Fi: ₹1,800/month", "Gym: ₹1,500/month"];
  const services = ["Housekeeping", "Laundry"];

  utilitiesList.innerHTML = utilities.map(u => `<div class="utility-item">${u}</div>`).join('');
  servicesList.innerHTML = services.map(s => `<div class="utility-item">${s}</div>`).join('');

  // Fetch Guest Bookings
  frappe.call({
    method: "smart_community.smart_community.api.get_guest_bookings",
    args: { email: email },
    callback: function(r) {
      const bookings = r.message.bookings || [];
      if (bookings.length === 0) {
        latestBookingsContainer.innerHTML = `<p class="text-muted">No bookings found.</p>`;
      } else {
        latestBookingsContainer.innerHTML = bookings.map(b => `
          <div class="booking-item">
            <p><strong>Apartment:</strong> ${b.apartment}</p>
            <p><strong>Guest:</strong> ${b.full_name}</p>
            <p><strong>Booking:</strong> ${b.start_date} - ${b.end_date}</p>
            <p><strong>Status:</strong> ${b.status}</p>
          </div>
        `).join('');
      }
    }
  });

  // Fetch Guest Bills
  frappe.call({
    method: "smart_community.smart_community.api.get_guest_bills",
    args: { email: email },
    callback: function(r) {
      let bills = r.message.bills || [];
      if (bills.length === 0) {
        monthlyBillContainer.innerHTML = `<p class="text-muted">No bills available.</p>`;
        return;
      }

      renderBills(bills);
    }
  });

  // Render function for Monthly Bills
  function renderBills(bills) {
    const unpaidBills = bills.filter(b => b.status === "Unpaid");

    if (unpaidBills.length === 0) {
      monthlyBillContainer.innerHTML = `<p class="text-success text-center fw-bold">🎉 No more pending bills! All bills are paid.</p>`;
      return;
    }

    let billHtml = unpaidBills.map(bill => {
      let itemsHtml = "";
      if(bill.items && bill.items.length) {
        itemsHtml = '<ul>';
        bill.items.forEach(item => {
          itemsHtml += `<li>${item.consumption_log}: ₹${item.amount}</li>`;
        });
        itemsHtml += '</ul>';
      }

      const totalAmount = bill.total_with_late || 0;

      return `
        <div class="booking-item">
          <p><strong>Resident:</strong> ${bill.resident}</p>
          <p><strong>Billing Month:</strong> ${bill.billing_month} ${bill.billing_year}</p>
          <p><strong>Due Date:</strong> ${bill.due_date}</p>
          <p><strong>Status:</strong> <span style="color:red">Unpaid</span></p>
          <p><strong>Days Late:</strong> ${bill.days_late || 0}</p>
          <p><strong>Late Fee:</strong> ₹${bill.late_fee_amount || 0}</p>
          <p><strong>Consumption Details:</strong> ${itemsHtml}</p>
          <p><strong>Total Amount:</strong> ₹${totalAmount}</p>
          <button class="pay-now-btn" data-bill="${bill.name}" data-amount="${totalAmount}">Pay Now</button>
        </div>
      `;
    }).join('');

    monthlyBillContainer.innerHTML = billHtml;

    // Razorpay payment handling
    document.querySelectorAll(".pay-now-btn").forEach(btn => {
      btn.addEventListener("click", function() {
        const bill_name = this.dataset.bill;
        const amount = parseFloat(this.dataset.amount) * 100; // paise

        var options = {
          "key": "rzp_test_1DP5mmOlF5G5ag",
          "amount": amount,
          "currency": "INR",
          "name": "Community Management",
          "description": "Bill Payment - " + bill_name,
          "handler": function(response){
            frappe.call({
              method: "smart_community.smart_community.api.mark_bill_paid",
              args: { bill_name: bill_name, payment_id: response.razorpay_payment_id },
              callback: function(res){
                frappe.msgprint("✅ Payment Successful!");
                
                // Remove the paid bill from display
                const updatedBills = bills.filter(b => b.name !== bill_name);
                renderBills(updatedBills);
              }
            });
          },
          "theme": { "color": "#1e40af" }
        };
        var rzp = new Razorpay(options);
        rzp.open();
      });
    });
  }

  // Toggle bills
  toggleBills.addEventListener("click", function() {
    if (monthlyBillContainer.style.display === "none") {
      monthlyBillContainer.style.display = "block";
      toggleBills.innerHTML = "&#9650;";
    } else {
      monthlyBillContainer.style.display = "none";
      toggleBills.innerHTML = "&#9660;";
    }
  });

  const deskNav = document.querySelector(".navbar, #navbarSupportedContent");
  if (deskNav) deskNav.style.display = "none";

  document.getElementById("guestDashboardLink").addEventListener("click", e => { 
    e.preventDefault(); 
    window.location.href="/guest-dashboard"; 
  });

  document.getElementById("logoutBtn").addEventListener("click", e => { 
    e.preventDefault(); 
    sessionStorage.removeItem("guest_email"); 
    frappe.msgprint("Logged out"); 
    window.location.href="/guest-login"; 
  });

});
</script>

{% endblock %}
